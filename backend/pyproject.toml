[project]
name = "chikka-reborn-backend"
version = "0.1.0"
description = "Chikka Reborn FastAPI backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Asserts and hard-coded fake secrets are expected in tests.
"tests/**" = ["S101", "S105", "S106", "S311", "E501"]
# The chat repository composes SQL from module-level fragments and fixed clauses picked in
# code (visibility rules, cursor direction). Every user-supplied value is a bound parameter.
"app/modules/chat/repository.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs code on greenlets; without this, lines after awaits inside a
# session are reported as missed even though tests execute them.
concurrency = ["thread", "greenlet"]
